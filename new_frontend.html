<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎵 智能卡拉OK搜尋系統 v2.0</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .search-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .search-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .search-input {
            flex: 1;
            padding: 15px 20px;
            border: 2px solid #e1e5e9;
            border-radius: 25px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }

        .search-input:focus {
            border-color: #667eea;
        }

        .search-btn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: transform 0.2s;
        }

        .search-btn:hover {
            transform: translateY(-2px);
        }

        .search-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .search-options {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            align-items: center;
        }

        .search-mode {
            display: flex;
            gap: 10px;
        }

        .mode-btn {
            padding: 8px 16px;
            border: 2px solid #e1e5e9;
            background: white;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 14px;
        }

        .mode-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 14px;
            color: #666;
        }

        .loading {
            text-align: center;
            padding: 40px;
            font-size: 18px;
            color: #667eea;
        }

        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .results-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f1f3f4;
        }

        .results-title {
            font-size: 1.5em;
            color: #333;
        }

        .results-stats {
            font-size: 14px;
            color: #666;
        }

        .song-card {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #667eea;
            transition: all 0.3s;
        }

        .song-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .song-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .song-info h3 {
            font-size: 1.3em;
            margin-bottom: 5px;
            color: #333;
        }

        .song-meta {
            display: flex;
            gap: 15px;
            font-size: 14px;
            color: #666;
        }

        .singer-name {
            font-weight: bold;
            color: #667eea;
        }

        .confidence-badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
        }

        .confidence-high {
            background: #d4edda;
            color: #155724;
        }

        .confidence-medium {
            background: #fff3cd;
            color: #856404;
        }

        .confidence-low {
            background: #f8d7da;
            color: #721c24;
        }

        .codes-section {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 10px;
        }

        .code-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            border-radius: 8px;
            border: 1px solid #e1e5e9;
            background: white;
        }

        .company-name {
            font-weight: bold;
            font-size: 14px;
        }

        .song-code {
            font-family: 'Courier New', monospace;
            font-weight: bold;
            padding: 2px 6px;
            background: #f1f3f4;
            border-radius: 4px;
        }

        /* 公司顏色主題 */
        .qiangui { border-left-color: #e74c3c; }
        .qiangui .company-name { color: #e74c3c; }

        .haoledi { border-left-color: #3498db; }
        .haoledi .company-name { color: #3498db; }

        .yinguei { border-left-color: #2ecc71; }
        .yinguei .company-name { color: #2ecc71; }

        .yinyuan { border-left-color: #f39c12; }
        .yinyuan .company-name { color: #f39c12; }

        .jinshang { border-left-color: #9b59b6; }
        .jinshang .company-name { color: #9b59b6; }

        .no-results {
            text-align: center;
            padding: 60px 20px;
            color: #666;
        }

        .no-results h3 {
            font-size: 1.5em;
            margin-bottom: 15px;
        }

        .suggestions {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            text-align: left;
        }

        .quick-suggestions {
            margin-top: 15px;
        }

        .suggestion-tags {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .suggestion-tag {
            padding: 6px 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .suggestion-tag:hover {
            background: #5a6fd8;
            transform: translateY(-1px);
        }

        .footer {
            text-align: center;
            padding: 40px 20px;
            color: rgba(255,255,255,0.8);
            font-size: 14px;
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .search-container {
                flex-direction: column;
            }
            
            .search-options {
                flex-direction: column;
                align-items: stretch;
            }
            
            .codes-section {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🎵 智能卡拉OK搜尋系統</h1>
            <p>整合多資料源，智能搜尋，精準匹配</p>
        </div>

        <div class="search-section">
            <div class="search-container">
                <input 
                    type="text" 
                    id="searchInput" 
                    class="search-input" 
                    placeholder="輸入歌曲名稱或歌手名稱（例：周杰倫、青花瓷、告白氣球）"
                    onkeypress="if(event.key==='Enter') smartSearch()"
                >
                <button class="search-btn" onclick="smartSearch()" id="searchBtn">
                    🔍 智能搜尋
                </button>
            </div>

            <div class="search-options">
                <div class="search-mode">
                    <div class="mode-btn active" onclick="setSearchMode('comprehensive')" id="comprehensiveMode">
                        🧠 綜合搜尋
                    </div>
                    <div class="mode-btn" onclick="setSearchMode('singer')" id="singerMode">
                        🎤 歌手專搜
                    </div>
                </div>
                
                <div class="stats" id="statsDisplay">
                    載入資料庫統計中...
                </div>
            </div>
        </div>

        <div id="loadingSection" class="loading" style="display: none;">
            <div class="spinner"></div>
            <div>搜尋中，請稍候...</div>
        </div>

        <div id="resultsSection" style="display: none;" class="results-section">
            <div class="results-header">
                <div class="results-title" id="resultsTitle">搜尋結果</div>
                <div class="results-stats" id="resultsStats"></div>
            </div>
            <div id="resultsContainer"></div>
        </div>

        <div id="noResults" style="display: none;" class="no-results">
            <h3>😔 沒有找到相關歌曲</h3>
            <div class="suggestions">
                <p><strong>💡 建議：</strong></p>
                <ul style="text-align: left; margin-left: 20px;">
                    <li>嘗試搜尋歌手名稱完整拼寫</li>
                    <li>使用歌曲的關鍵字或部分歌詞</li>
                    <li>檢查是否有拼字錯誤</li>
                    <li>嘗試簡化搜尋詞彙</li>
                </ul>
                
                <div class="quick-suggestions">
                    <p><strong>🔥 熱門搜尋：</strong></p>
                    <div class="suggestion-tags">
                        <button class="suggestion-tag" onclick="quickSearch('周杰倫')">周杰倫</button>
                        <button class="suggestion-tag" onclick="quickSearch('蔡依林')">蔡依林</button>
                        <button class="suggestion-tag" onclick="quickSearch('鄧紫棋')">鄧紫棋</button>
                        <button class="suggestion-tag" onclick="quickSearch('告五人')">告五人</button>
                        <button class="suggestion-tag" onclick="quickSearch('愛情')">愛情</button>
                        <button class="suggestion-tag" onclick="quickSearch('青花瓷')">青花瓷</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="footer">
            <p>🎯 涵蓋台灣主要KTV系統 | 🔄 即時更新資料庫 | 🚀 智能搜尋演算法</p>
        </div>
    </div>

    <script>
        // 全局變數
        let currentSearchMode = 'comprehensive';
        let searchResults = [];

        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadStats();
        });

        // 載入資料庫統計
        async function loadStats() {
            try {
                const response = await fetch('http://localhost:5001/api/stats');
                const data = await response.json();
                
                if (data.success) {
                    const stats = data.stats;
                    document.getElementById('statsDisplay').innerHTML = `
                        📚 歌曲: ${stats.songs_db_count?.toLocaleString() || 'N/A'} 首 | 
                        🎤 歌手: ${stats.singers_count || 'N/A'} 位 | 
                        🔄 統一庫: ${stats.unified_db_songs?.toLocaleString() || 'N/A'} 首
                    `;
                }
            } catch (error) {
                console.error('載入統計失敗:', error);
                document.getElementById('statsDisplay').innerHTML = '📊 資料庫統計載入失敗';
            }
        }

        // 設定搜尋模式
        function setSearchMode(mode) {
            currentSearchMode = mode;
            
            // 更新按鈕狀態
            document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(mode + 'Mode').classList.add('active');
        }

        // 智能搜尋
        async function smartSearch() {
            const query = document.getElementById('searchInput').value.trim();
            
            if (!query) {
                alert('請輸入搜尋關鍵字');
                return;
            }

            // 顯示載入狀態
            showLoading(true);
            hideResults();

            try {
                let apiUrl;
                
                if (currentSearchMode === 'singer') {
                    apiUrl = `http://localhost:5001/api/singer-search?singer=${encodeURIComponent(query)}`;
                } else {
                    apiUrl = `http://localhost:5001/api/enhanced-search?keyword=${encodeURIComponent(query)}`;
                }

                console.log('搜尋API:', apiUrl);
                const response = await fetch(apiUrl);
                const data = await response.json();

                console.log('搜尋結果:', data);

                if (data.success && data.data && data.data.length > 0) {
                    searchResults = data.data;
                    displayResults(searchResults, query);
                } else {
                    showNoResults();
                }

            } catch (error) {
                console.error('搜尋失敗:', error);
                alert('搜尋過程發生錯誤，請檢查網路連線或聯繫系統管理員');
            } finally {
                showLoading(false);
            }
        }

        // 快速搜尋
        function quickSearch(keyword) {
            document.getElementById('searchInput').value = keyword;
            smartSearch();
        }

        // 顯示結果
        function displayResults(results, query) {
            const resultsSection = document.getElementById('resultsSection');
            const resultsTitle = document.getElementById('resultsTitle');
            const resultsStats = document.getElementById('resultsStats');
            const resultsContainer = document.getElementById('resultsContainer');

            // 更新標題和統計
            const modeText = currentSearchMode === 'singer' ? '🎤 歌手作品' : '🧠 智能搜尋';
            resultsTitle.textContent = `${modeText}結果：${query}`;
            resultsStats.textContent = `找到 ${results.length} 首歌曲`;

            // 清空並重新建立結果
            resultsContainer.innerHTML = '';

            results.forEach((song, index) => {
                const songCard = createSongCard(song, index);
                resultsContainer.appendChild(songCard);
            });

            // 顯示結果區域
            resultsSection.style.display = 'block';
        }

        // 創建歌曲卡片
        function createSongCard(song, index) {
            const card = document.createElement('div');
            card.className = 'song-card';

            // 計算信心度顯示
            const confidence = song.confidence || 0.5;
            let confidenceClass, confidenceText;
            
            if (confidence >= 0.8) {
                confidenceClass = 'confidence-high';
                confidenceText = '高度匹配';
            } else if (confidence >= 0.6) {
                confidenceClass = 'confidence-medium';
                confidenceText = '中度匹配';
            } else {
                confidenceClass = 'confidence-low';
                confidenceText = '低度匹配';
            }

            // 處理編號資訊
            const codes = song.編號資訊 || [];
            const codesHTML = codes.map(code => {
                const companyClass = getCompanyClass(code.公司);
                return `
                    <div class="code-item ${companyClass}">
                        <span class="company-name">${code.公司}</span>
                        <span class="song-code">${code.編號}</span>
                    </div>
                `;
            }).join('');

            card.innerHTML = `
                <div class="song-header">
                    <div class="song-info">
                        <h3>${song.歌名 || 'N/A'}</h3>
                        <div class="song-meta">
                            <span class="singer-name">${song.歌手 || 'N/A'}</span>
                            ${song.語言 ? `<span>📝 ${song.語言}</span>` : ''}
                            ${song.sources ? `<span>📊 來源: ${song.sources.join(', ')}</span>` : ''}
                        </div>
                    </div>
                    <div class="confidence-badge ${confidenceClass}">
                        ${confidenceText}
                    </div>
                </div>
                
                ${codes.length > 0 ? `
                    <div class="codes-section">
                        ${codesHTML}
                    </div>
                ` : '<div style="color: #999; font-style: italic;">暫無編號資訊</div>'}
            `;

            return card;
        }

        // 取得公司樣式類別
        function getCompanyClass(company) {
            const classMap = {
                '錢櫃': 'qiangui',
                '好樂迪': 'haoledi',
                '銀櫃': 'yinguei',
                '音圓': 'yinyuan',
                '金嗓': 'jinshang'
            };
            return classMap[company] || 'default';
        }

        // 顯示/隱藏載入狀態
        function showLoading(show) {
            document.getElementById('loadingSection').style.display = show ? 'block' : 'none';
            document.getElementById('searchBtn').disabled = show;
        }

        // 隱藏結果
        function hideResults() {
            document.getElementById('resultsSection').style.display = 'none';
            document.getElementById('noResults').style.display = 'none';
        }

        // 顯示無結果
        function showNoResults() {
            document.getElementById('noResults').style.display = 'block';
        }
    </script>
</body>
</html>
